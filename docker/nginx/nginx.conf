# Global events configuration
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security: Hide Nginx version
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Definitions for Internal Container Network
    upstream backend_api {
        server backend:3000;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client body limit for file/excel/student uploads (max 25MB)
        client_max_body_size 25M;

        # Standard Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 1. API Reverse Proxy Routing (/api/v1/ and /api/)
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Connection & Header Preservation
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass essential multi-tenant and idempotency headers
            proxy_set_header x-school-id $http_x_school_id;
            proxy_set_header idempotency-key $http_idempotency_key;
            proxy_set_header Idempotency-Key $http_idempotency_key;

            # Timeout Settings (8s upstream timeout + buffer)
            proxy_connect_timeout 15s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # -------------------------------------------------------------
        # 2. Frontend SPA Static Assets & Route Routing
        # -------------------------------------------------------------
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Caching headers for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend_spa;
                proxy_set_header Host $host;
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Health endpoint for Nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
